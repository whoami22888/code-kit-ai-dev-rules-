# Run shared rules-engine, OpenAI entry-point and Claude compatibility tests at each PR head.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Hook tests create temporary git repositories, commits and merges.
      - run: git config --global user.name "code-kit CI" && git config --global user.email "ci@code-kit.invalid" && git config --global init.defaultBranch main
      # Read-only contract validation does not require Claude Code.
      - run: npm run agent:doctor:self
      # Claude mod tests use the plugin runner; test/mod.mjs skips on older Claude.
      - run: npm install --global @anthropic-ai/claude-code
      - run: npm test
      - run: npx --yes prettier@3.9.10 --check .
